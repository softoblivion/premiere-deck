<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Premiere Deck</title>
    <script>
        // The theme of the last session is drawn before the host answers (docs/PANEL.md 2); display.js keeps it
        // in step with the host's `theme` message. Without storage the page starts in the default theme.
        (function () {
            try {
                var name = window.localStorage.getItem("deck.theme");
                document.documentElement.setAttribute("data-theme", name === "sky" ? "sky" : "black");
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "black");
            }
        }());
    </script>
    <link rel="stylesheet" href="css/panel.css">
</head>
<body>
    <div id="deck"></div>
    <script src="js/CSInterface.js"></script>
    <script src="js/common.js"></script>
    <script src="js/display.js"></script>
</body>
</html>
