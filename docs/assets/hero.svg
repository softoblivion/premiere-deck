<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Premiere Deck">
  <title>Premiere Deck</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="0.55" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#191d24"/>
    </linearGradient>
    <radialGradient id="blob-hue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5f6f8c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5f6f8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-accent" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7563ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7563ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7563ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7563ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,system-ui,sans-serif; fill: #ffffff; }
    .name { font-size: 68px; font-weight: 700; letter-spacing: -0.02em; }
    .tag { font-size: 25px; font-weight: 400; fill-opacity: 0.78; }
    .meta { font-size: 16px; font-weight: 600; fill-opacity: 0.5; letter-spacing: 0.12em; text-transform: uppercase; }
    .b1 { animation: drift1 26s ease-in-out infinite alternate; }
    .b2 { animation: drift2 31s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(90px, -40px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-110px, 50px); } }
    @media (prefers-reduced-motion: reduce) { .b1, .b2 { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="922" cy="72" r="312" fill="url(#blob-hue)"/>
      <circle class="b2" cx="384" cy="380" r="248" fill="url(#blob-accent)"/>
    </g>
    <rect x="112.0" y="120.0" width="160" height="160" rx="32" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="144.0" y="152.0" width="96.0" height="96.0" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet">
  
  <defs>
    <linearGradient id="ic-pr-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b84ff"/><stop offset="0.55" stop-color="#5b36e0"/><stop offset="1" stop-color="#2c1394"/>
    </linearGradient>
    <linearGradient id="ic-pr-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ic-pr-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="ic-pr-glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#d9ceff" stop-opacity="0.5"/><stop offset="1" stop-color="#d9ceff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#ic-pr-body)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#ic-pr-glow)"/>
  <path d="M10 18c0-6 4-9 10-9h24c6 0 10 3 10 9v1c-12 5-32 5-44 0Z" fill="url(#ic-pr-sheen)" opacity="0.7"/>
  <g fill="none" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 45V19.5h8.2a7.6 7.6 0 0 1 0 15.2h-8.2"/>
    <path d="M39.5 45V30.5"/>
    <path d="M39.5 34.6c1.4-3.6 4.4-5.6 8.3-5.4"/>
  </g>
  <rect x="3.6" y="3.6" width="56.8" height="56.8" rx="14.4" fill="none" stroke="url(#ic-pr-rim)" stroke-width="1.2"/>
</svg>
    <text class="t name" x="320.0" y="190.0">Premiere Deck</text>
    <rect x="320.0" y="204.0" width="200" height="3" rx="1.5" fill="url(#line)"/>
    <text class="t tag" x="320.0" y="241.0">Media organizer and quick actions for Adobe Premiere Pro</text>
    <text class="t meta" x="320.0" y="279.0">Windows 10 / 11 · Premiere Pro · Open source</text>
  </g>
</svg>
