[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "premiere-deck"
dynamic = ["version"]
description = "Host application and CEP panel that remove routine from editing in Adobe Premiere Pro"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
authors = [{ name = "softoblivion" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pywebview==6.2.1",
    "pythonnet>=3.0.3",
    "websockets>=17.0",
    "watchdog>=6.0",
    "numpy>=2.0",
    "onnxruntime-directml>=1.24",
    "tokenizers>=0.23",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.22"]

[project.urls]
Homepage = "https://github.com/softoblivion/premiere-deck"

[project.gui-scripts]
premiere-deck = "premiere_deck.shell.main:main"

[tool.setuptools.dynamic]
version = { attr = "premiere_deck.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
premiere_deck = ["ui/**/*", "panel/**/*", "premiere/jsx/*", "modules/**/*"]
