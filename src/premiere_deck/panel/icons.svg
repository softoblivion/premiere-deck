    <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
  </linearGradient>
  <radialGradient id="pr-glow" cx="0.3" cy="0.15" r="0.9">
    <stop offset="0" stop-color="#d9ceff" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#d9ceff" stop-opacity="0"/>
  </radialGradient>
</defs>

