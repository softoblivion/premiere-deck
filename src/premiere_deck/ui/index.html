<!doctype html>
<html lang="en" data-theme="black" data-mode="compact" data-screen="idle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="darkreader-lock">
  <title>Premiere Deck</title>
  <link rel="icon" href="assets/glyph.svg" type="image/svg+xml">
  <!-- The cached theme before the first paint (js/main.js writes the key on every confirmed settings object). -->
  <script>try{var t=localStorage.getItem('pd.theme');if(["black","sky"].indexOf(t)>=0)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <!-- Liquid UI design kit: the project-owned copy (vendor/liquid_ui/KIT.txt); themes.css is generated from themes.json. -->
  <link rel="stylesheet" href="vendor/liquid_ui/css/tokens.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/themes.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/base.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/scene.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/glass.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/components.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/titlebar.css">
  <!-- Premiere Deck host window (docs/HOST_UI.md). -->
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Scene behind everything (kit js/background.js). -->
  <div id="scene" aria-hidden="true"></div>

  <!-- SVG filters of the lenses (kit js/glass.js appends one <filter> per surface). -->
  <svg id="lg-defs" aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden"><defs></defs></svg>

  <div id="app">
    <!-- Title bar (kit js/titlebar.js): glyph, name and version pill left (main only), the module tabs in the
         centre (main only), settings | minimize, close right (docs/HOST_UI.md 2). -->
    <header id="titlebar"></header>

    <!-- Idle and waiting (compact window), js/pages/compact.js. -->
    <main id="compact" class="compact" tabindex="-1"></main>
    <!-- Main (wide window): the left column and the module tabs, js/pages/wide.js. -->
    <div id="wide" class="wide" hidden></div>
  </div>

  <!-- Overlays grow out of the control that opened them (kit js/overlay.js). -->
  <div id="update-pop" class="popover" role="dialog" aria-label="Premiere Deck updates"><div class="ov-content"></div></div>
  <div id="settings-sheet" class="sheet settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="ov-content"></div></div>
  <div id="confirm-sheet" class="sheet confirm-sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><div class="ov-content"></div></div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
